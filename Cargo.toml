[package]
name = "emoji_search"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A library for searching emojis based on keywords"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.8"
bitcode = { version = "0.6.6", features = ["serde"] }
serde-protobuf = "0.8.2"
log = "0.4.27"
env_logger = "0.11.8"
emoji = { path = "../emoji-rs/emoji"}
gpui-component = "0.2.0"
sonic-rs = "0.5.6"

[build-dependencies]
serde          = { version = "1.0", features = ["derive"] }
emoji = { path = "../emoji-rs/emoji"}
serde_json     = "1.0"
bitcode        = { version = "0.6.6", features = ["std","serde"] }


# Generating a library in all the main formats just in case
[lib]
name = "emoji_search"
crate-type = ["cdylib", "staticlib", "rlib"]
